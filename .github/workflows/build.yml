name: Build Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bruce-firmware
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Disable FastLED
        run: |
          sed -i '/fastled\/FastLED/d' platformio.ini
          sed -i '/\[env\]/a lib_ignore = FastLED' platformio.ini

      - name: Run PlatformIO Build
        run: pio run -e esp32-s3-st7735

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3
          path: bruce-firmware/.pio/build/esp32-s3-st7735/firmware.bin
